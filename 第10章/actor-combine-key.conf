input {
  jdbc {
    jdbc_driver_library => "D:\\logstash-7.9.1\\bin\\mysql-connector-java-5.1.44.jar"
    jdbc_driver_class => "com.mysql.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://localhost:3305/sakila?serverTimezone=GMT%2B8"
    jdbc_user => "root"
    jdbc_password => "1234"
	# 为了格式化日期，需要将date字段转为字符串
    statement => "SELECT actor_id,first_name,last_name,date_format(last_update, '%Y-%m-%d %H:%i:%S') as last_update from actor"
  }
}

filter {
  mutate {  
       remove_field => ["@timestamp"]  
  } 
  mutate {  
       remove_field => ["@version"]  
  }
  mutate {
    add_field =>{
       "newkey" => "%{first_name}-%{last_name}" 
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }
  
  elasticsearch {
	hosts => ["http://localhost:9200"]
    index => "actor"
    document_id => "%{first_name}-%{last_name}"
	action => "index" 
  }
}
