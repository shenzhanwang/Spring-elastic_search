input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => { "message" => "%{IP:ip} \[%{HTTPDATE:timestamp}\] %{WORD:method} %{DATA:url} %{NUMBER:serverport} %{NUMBER:statuscode} %{NUMBER:duration} %{URI:path}\;" }
  }
}

output {
  stdout {
    codec => rubydebug
  }

  if [@metadata][_id] {
    elasticsearch {
      hosts => ["http://192.168.34.1:9200"]
      document_id => "%{[@metadata][_id]}" 
      index => "myfilebeat-%{[agent][version]}-%{+yyyy.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://192.168.34.1:9200"]
      index => "myfilebeat-%{[agent][version]}-%{+yyyy.MM.dd}"
    }
  }
}
